name: deploy

# Ships the dbt runner: build the image once and push it (tagged with the commit), point dev
# at it and run dbt once as a smoke test, then point production at the same image (after
# approval, if the production environment requires it) and run it again.
#
# Infrastructure is applied by terragrunt-apply.yml; this only ships the image. To roll back,
# re-run an earlier run of this workflow. Each environment's DEPLOY_ROLE_ARN, FUNCTION_NAME
# and REPOSITORY_URL come from personal-infra's deploy role stack for that environment.

on:
  # Paused while this project's AWS resources are torn down (see the README): runs only when
  # started by hand. Reverting the pause PR restores the automatic triggers.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # to sign in to AWS as this environment's deploy role
    # Only the digest crosses jobs: GitHub drops job outputs that contain a secret, and the
    # repository URL is one (it contains the AWS account ID).
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Build and push the image
        id: push
        env:
          REPOSITORY_URL: ${{ secrets.REPOSITORY_URL }}
        run: |
          set -euo pipefail
          scripts/build-image.sh "$REPOSITORY_URL:$GITHUB_SHA"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY_URL%%/*}"
          docker push --quiet "$REPOSITORY_URL:$GITHUB_SHA"
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY_URL:$GITHUB_SHA")
          echo "digest=${image#*@}" >> "$GITHUB_OUTPUT"
      - run: scripts/deploy.sh "$FUNCTION_NAME" "$REPOSITORY_URL@$DIGEST"
        env:
          FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
          REPOSITORY_URL: ${{ secrets.REPOSITORY_URL }}
          DIGEST: ${{ steps.push.outputs.digest }}
      - run: scripts/smoke-test.sh "$FUNCTION_NAME"
        env:
          FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}

  production:
    needs: dev
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - run: scripts/deploy.sh "$FUNCTION_NAME" "$REPOSITORY_URL@$DIGEST"
        env:
          FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
          REPOSITORY_URL: ${{ secrets.REPOSITORY_URL }}
          DIGEST: ${{ needs.dev.outputs.digest }}
      - run: scripts/smoke-test.sh "$FUNCTION_NAME"
        env:
          FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
