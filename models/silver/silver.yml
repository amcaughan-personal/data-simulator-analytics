models:
  - name: silver_transactions
    description: >
      One row per transaction, cleaned and deduplicated. Incremental: each run merges the
      days since the last run.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: event_at
        data_tests: [not_null]
      - name: merchant_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_merchants')
                field: merchant_id
      - name: merchant_category
        data_tests:
          - accepted_values:
              arguments:
                values: [grocery, restaurant, online, travel]
      - name: card_type
        data_tests:
          - accepted_values:
              arguments:
                values: [debit, credit, prepaid]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: [in_store, online]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [approved, declined]
      - name: amount
        data_tests: [not_null]
  - name: silver_merchants
    description: The merchants as of the latest daily snapshot, one row per merchant.
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]
      - name: risk_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [low, medium, high]
