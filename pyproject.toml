[project]
name = "data-simulator-analytics"
version = "0.1.0"
description = "dbt models over the data-simulator ELT's raw payments data, on Athena."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-athena>=1.11,<1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false
# Never resolve to a package version published in the last week.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # Raised inside Jinja (which dbt uses), not by this project.
    "ignore::DeprecationWarning:jinja2.lexer",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
